[build]
  publish = "dist"
  functions = "netlify/functions"

[functions]
  # club.js reads clubs/<slug>/config.json at runtime, so it has to travel
  # with the bundle.
  included_files = ["clubs/**/*.json"]

[dev]
  port = 8888
  targetPort = 5173
  command = "npm run dev:client"
  autoLaunch = false
  address = "0.0.0.0"
